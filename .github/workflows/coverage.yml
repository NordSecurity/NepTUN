name: Coverage
on: [workflow_call]
permissions: {}

jobs:
  coverage-linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate code coverage
      run: |
        sudo apt-get install -y libpcap-dev
        cargo xtask code-coverage clean
        cargo xtask code-coverage mock-instant
        cargo xtask code-coverage docker-tests
        cargo xtask code-coverage report-lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: linux
        files: target/lcov.info
        fail_ci_if_error: true

  coverage-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate code coverage
      run: |
        cargo xtask code-coverage clean
        cargo xtask code-coverage mock-instant
        # Docker not available in GitHub runners for Apple Silicon, so run only
        # the device tests that do not need a container.
        CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER="sudo -E" \
          cargo llvm-cov --features device,docker-tests --test device --no-report -- \
            --test-threads=1 --skip test_wg_start --skip test_wg_concurrent 2>&1 | tee dev.log
        grep -q "6 passed" dev.log || { echo "::error::expected 6 Docker-free device tests"; exit 1; }
        cargo xtask code-coverage report-lcov
    - name: Did the Apple-only rebuild code get covered?
      run: |
        grep -E 'FNDA:[0-9]+,.*(rebuild_listen_sockets|bind_listen_sockets)' target/lcov.info \
          || echo "::warning::no function records matched - check lcov format"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: macos
        files: target/lcov.info
        fail_ci_if_error: true
